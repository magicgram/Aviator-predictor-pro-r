<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aviator Predictor Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Poppins', sans-serif;
        background-color: #020418;
      }
      
      @keyframes gradient-flow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      .text-gradient-cyan {
        background: linear-gradient(
          -45deg, 
          #2dfdea, 
          #1dd0f0, 
          #a2f9ff,
          #1dd0f0,
          #2dfdea
        );
        background-size: 400% 400%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: gradient-flow 8s ease infinite;
      }

      .text-nexus-gradient {
        background: linear-gradient(
          -45deg, 
          #a855f7, 
          #60a5fa,
          #3b82f6,
          #a855f7
        );
        background-size: 400% 400%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: gradient-flow 8s ease infinite;
      }

      @keyframes logo-pulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #a855f7); }
        50% { transform: scale(1.1); filter: drop-shadow(0 0 5px #60a5fa); }
      }

      .nexus-logo-animation {
        animation: logo-pulse 4s ease-in-out infinite;
      }

      .btn-glow {
        box-shadow: 0 0 5px #00f5d4, 0 0 10px #00f5d4;
      }
      .btn-glow-danger {
        box-shadow: 0 0 5px #f43f5e, 0 0 10px #f43f5e;
      }
      .btn-glow-dark {
        box-shadow: 0 0 5px #4f46e5, 0 0 10px #4f46e5;
      }
      .card-bg {
        background-color: rgba(10, 10, 36, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(0, 245, 212, 0.2);
        box-shadow: 0 0 40px rgba(0, 245, 212, 0.1);
        will-change: transform;
      }
    </style>

}
</script>
</head>

</html>
